AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Peach backend on AWS Lambda: the FastAPI app in a container image, served over
  HTTPS by a Lambda function URL, with Postgres on a db.t4g.micro RDS
  instance. Deployed by scripts/deploy-backend.sh, which builds and pushes the
  image first - the ECR repository lives outside this stack because the
  function cannot be created until an image exists.

  On the AWS Free plan all of it is covered: Lambda bills per request, and one
  micro instance with 20 GiB is inside the free allowance.

  The function URL is the API's own HTTPS name; a custom domain goes in front
  of it separately (PROJECT.md section 12).

Parameters:
  ProjectName:
    Type: String
    Default: peach
    Description: Prefix for every resource name, and the project tag.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC that holds the function's network interfaces and the database.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >-
      Two or more subnets, in different AZs, for the function and the database.
      The function needs no internet access - it only talks to the database -
      so the default VPC's subnets do without a NAT gateway.

  ImageUri:
    Type: String
    Description: Fully qualified image, e.g. <account>.dkr.ecr.<region>.amazonaws.com/peach-backend:abc1234

  Architecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]
    Description: arm64 (Graviton) is cheaper per GB-second and builds natively on Apple Silicon.

  MemorySize:
    Type: Number
    Default: 512
    MinValue: 128
    MaxValue: 10240
    Description: MB. CPU is allocated in proportion, so this also sets the speed.

  TimeoutSeconds:
    Type: Number
    Default: 30
    MinValue: 3
    MaxValue: 900
    Description: >-
      Seconds a request may take, cold start and database connection included.

  DbName:
    Type: String
    Default: peach

  DbUsername:
    Type: String
    Default: peach

  DbPassword:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: >-
      Generated and remembered by the deploy script. RDS forbids /, ", @ and
      spaces here, which also keeps the composed connection URL safe to use raw.

  DbEngineVersion:
    Type: String
    Default: "17.6"
    Description: >-
      RDS PostgreSQL version - 17, like the postgres:17-alpine Compose runs.

  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
    Description: >-
      The smallest burstable class; on the AWS Free plan it costs nothing.

  DbAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    Description: GiB of gp2 storage; 20 is what the Free plan covers.

  DbBackupRetentionDays:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 35

  AppEnv:
    Type: String
    Default: production
    AllowedValues: [development, test, production]

  LogLevel:
    Type: String
    Default: info

  CorsOrigins:
    Type: String
    Default: "*"
    Description: Comma-separated browser origins; set this to the deployed frontend URL.

  CognitoUserPoolId:
    Type: String
    Default: ""
    Description: >-
      From make deploy-cognito. Empty means no pool: every protected endpoint
      then answers 503, never an open door.

  CognitoClientId:
    Type: String
    Default: ""
    Description: The web app client; tokens minted for any other client are refused.

  CognitoJwks:
    Type: String
    Default: ""
    Description: >-
      The pool's public signing keys, as JSON. The function has no internet
      route to fetch them, so the deploy script downloads and passes them in.

  LogRetentionDays:
    Type: Number
    Default: 7
    Description: CloudWatch gives 5 GB of ingestion and storage free each month.

Resources:
  # --- networking ---------------------------------------------------------

  FunctionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} backend function"
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-backend-function"
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${ProjectName} database"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: Postgres, from the function only
          IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref FunctionSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-db"
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # --- database -----------------------------------------------------------

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${ProjectName} database"
      SubnetIds: !Ref SubnetIds
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # A starter database: one small RDS PostgreSQL instance, never reachable
  # from the internet, and torn down with the stack. Plain RDS rather than
  # Aurora Serverless because an account on the AWS Free plan may only create
  # Aurora with "express configuration", which CloudFormation cannot express.
  # Turn on DeletionProtection before this holds anything you would miss.
  DbInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub "${ProjectName}-db"
      Engine: postgres
      EngineVersion: !Ref DbEngineVersion
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      StorageType: gp2
      StorageEncrypted: true
      DBName: !Ref DbName
      MasterUsername: !Ref DbUsername
      MasterUserPassword: !Ref DbPassword
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: !Ref DbBackupRetentionDays
      CopyTagsToSnapshot: true
      DeletionProtection: false
      AutoMinorVersionUpgrade: true
      EnablePerformanceInsights: false
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Kept for people and tools: the deploy script reads the password back from
  # here, so it stays stable across deploys. The function does not read it - it
  # has no route to Secrets Manager without a NAT gateway or a paid endpoint -
  # and gets the same string as an environment variable instead.
  DatabaseUrlSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}/backend/database-url"
      Description: !Sub "SQLAlchemy async connection string for ${ProjectName}"
      SecretString: !Sub
        - "postgresql+asyncpg://${DbUsername}:${DbPassword}@${Endpoint}:${Port}/${DbName}"
        - Endpoint: !GetAtt DbInstance.Endpoint.Address
          Port: !GetAtt DbInstance.Endpoint.Port
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # --- function -----------------------------------------------------------

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Logs, plus the network interfaces a function in a VPC needs.
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-backend"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  Function:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-backend"
      Description: !Sub "${ProjectName} FastAPI backend"
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Architectures: [!Ref Architecture]
      MemorySize: !Ref MemorySize
      Timeout: !Ref TimeoutSeconds
      Role: !GetAtt ExecutionRole.Arn
      LoggingConfig:
        LogGroup: !Ref LogGroup
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds: [!Ref FunctionSecurityGroup]
      Environment:
        Variables:
          APP_ENV: !Ref AppEnv
          LOG_LEVEL: !Ref LogLevel
          CORS_ORIGINS: !Ref CorsOrigins
          COGNITO_REGION: !Ref AWS::Region
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          COGNITO_JWKS: !Ref CognitoJwks
          # No pool: every warm environment would keep its own connections
          # open, and a micro instance has few to share.
          DB_POOLING: "false"
          DATABASE_URL: !Sub
            - "postgresql+asyncpg://${DbUsername}:${DbPassword}@${Endpoint}:${Port}/${DbName}"
            - Endpoint: !GetAtt DbInstance.Endpoint.Address
              Port: !GetAtt DbInstance.Endpoint.Port
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # HTTPS out of the box, on AWS's certificate. CORS is left to the app, since
  # configuring it here too would send every header twice.
  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref Function
      AuthType: NONE

  # A public function URL needs both grants: InvokeFunctionUrl, and
  # InvokeFunction limited to calls that came through the URL.
  FunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  FunctionUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  ApiUrl:
    Description: Base URL of the backend, with no trailing slash.
    Value: !Sub
      - "https://${Host}"
      - Host: !Select [2, !Split ["/", !GetAtt FunctionUrl.FunctionUrl]]

  FunctionName:
    Value: !Ref Function

  DatabaseEndpoint:
    Value: !GetAtt DbInstance.Endpoint.Address

  DatabaseUrlSecretArn:
    Value: !Ref DatabaseUrlSecret

  LogGroupName:
    Value: !Ref LogGroup
