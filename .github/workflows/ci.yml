name: CI

# Lint and test both sides. Pull requests run it before anything reaches main;
# pushes to main run it on what was merged. deploy.yml will call it too, so a
# deploy never ships a commit these checks have not passed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check --output-format=github .

      - name: ruff format --check
        run: uv run ruff format --check --diff .

  backend-test:
    name: Backend tests (pytest + Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The same image Compose runs. The suite creates its own <db>_test database
    # next to this one and drops and rebuilds its schema there.
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: peach
          POSTGRES_PASSWORD: peach
          POSTGRES_DB: peach
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U peach -d peach"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://peach:peach@localhost:5432/peach
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen

      - name: pytest
        run: uv run pytest -q

  frontend-lint:
    name: Frontend lint (eslint + prettier + tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: eslint
        run: pnpm lint

      - name: prettier --check
        run: pnpm format:check

      - name: tsc --noEmit
        run: pnpm exec tsc --noEmit

  frontend-test:
    name: Frontend tests (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: vitest
        run: pnpm test
