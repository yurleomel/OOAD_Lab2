<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" font-family="Inter Tight, Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Lab 8, Part 4: the cloud pipeline</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3f4a5a"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #3f4a5a; stroke-width: 1.5; }
      .aws { fill: #eef4fb; stroke: #2f6db5; }
      .kept { fill: #f2f6ef; stroke: #4f7a3a; }
      .title { font-size: 17px; font-weight: 600; fill: #16202e; text-anchor: middle; }
      .detail { font-size: 13.5px; fill: #3f4a5a; text-anchor: middle; }
      .edge { font-size: 13.5px; font-weight: 600; fill: #16202e; text-anchor: middle; }
      .frame { fill: none; stroke: #2f6db5; stroke-width: 1.5; stroke-dasharray: 7 6; }
      .frame-label { font-size: 13.5px; font-weight: 600; fill: #2f6db5; }
      .note { font-size: 14.5px; fill: #3f4a5a; }
      .heading { font-size: 24px; font-weight: 600; fill: #16202e; }
      line { stroke: #3f4a5a; stroke-width: 1.8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="640" fill="#ffffff"/>
  <text class="heading" x="35" y="46">Payments stream: from a producer to Athena, with a failure alert</text>

  <!-- what the Terraform switch creates and removes -->
  <rect class="frame" x="243" y="92" width="472" height="358" rx="10"/>
  <text class="frame-label" x="259" y="116">Terraform: infra/lab8, switched by lab8_stream_enabled</text>

  <!-- top row -->
  <rect class="box" x="35" y="150" width="170" height="104" rx="8"/>
  <text class="title" x="120" y="184">Producer</text>
  <text class="detail" x="120" y="208">Python on the laptop</text>
  <text class="detail" x="120" y="228">put_records</text>

  <rect class="box aws" x="267" y="150" width="170" height="104" rx="8"/>
  <text class="title" x="352" y="184" style="font-size:15px">Kinesis Data Streams</text>
  <text class="detail" x="352" y="208">on-demand, 24 h retention</text>
  <text class="detail" x="352" y="228">key: invoiceId</text>

  <rect class="box aws" x="499" y="150" width="170" height="104" rx="8"/>
  <text class="title" x="584" y="184">Data Firehose</text>
  <text class="detail" x="584" y="208">buffer: 60 s or 5 MB</text>
  <text class="detail" x="584" y="228">JSON lines</text>

  <rect class="box kept" x="755" y="150" width="170" height="104" rx="8"/>
  <text class="title" x="840" y="184">S3</text>
  <text class="detail" x="840" y="208">payments-stream/</text>
  <text class="detail" x="840" y="228">dt=YYYY-MM-DD/</text>

  <rect class="box kept" x="975" y="150" width="170" height="104" rx="8"/>
  <text class="title" x="1060" y="184">Glue Crawler</text>
  <text class="detail" x="1060" y="208">+ Data Catalog</text>
  <text class="detail" x="1060" y="228">database lab8_stream</text>

  <rect class="box kept" x="1195" y="150" width="170" height="104" rx="8"/>
  <text class="title" x="1280" y="184">Athena</text>
  <text class="detail" x="1280" y="208">SQL over the files</text>
  <text class="detail" x="1280" y="228">workgroup peach-lab8</text>

  <line x1="205" y1="202" x2="265" y2="202"/>
  <line x1="437" y1="202" x2="497" y2="202"/>
  <line x1="669" y1="202" x2="753" y2="202"/>
  <line x1="925" y1="202" x2="973" y2="202"/>
  <line x1="1145" y1="202" x2="1193" y2="202"/>

  <!-- bottom row -->
  <rect class="box aws" x="267" y="330" width="170" height="104" rx="8"/>
  <text class="title" x="352" y="364">Lambda</text>
  <text class="detail" x="352" y="388">failure share per batch</text>
  <text class="detail" x="352" y="408">up to 1,000 events or 60 s</text>

  <rect class="box aws" x="499" y="330" width="170" height="104" rx="8"/>
  <text class="title" x="584" y="374">SNS topic</text>
  <text class="detail" x="584" y="398">email subscription</text>

  <rect class="box" x="755" y="330" width="170" height="104" rx="8"/>
  <text class="title" x="840" y="374">Email alert</text>
  <text class="detail" x="840" y="398">to the account owner</text>

  <line x1="352" y1="254" x2="352" y2="328"/>
  <line x1="437" y1="382" x2="497" y2="382"/>
  <line x1="669" y1="382" x2="753" y2="382"/>
  <text class="edge" x="467" y="372">&gt; 10%</text>

  <!-- legend -->
  <rect class="box aws" x="35" y="486" width="18" height="18" rx="3"/>
  <text class="note" x="62" y="500">Created and removed with one pull request each, so no stream keeps billing after the lab.</text>
  <rect class="box kept" x="35" y="516" width="18" height="18" rx="3"/>
  <text class="note" x="62" y="530">Stays outside the switch, so the delivered data can still be queried afterwards.</text>
  <text class="note" x="35" y="572">Data source: the same Uklon payment events as Parts 2 and 3. The producer replays three ten-minute slices of one day's file;</text>
  <text class="note" x="35" y="594">the last two run with --fail-rate 0.3, which flips 30% of the payments to failed so that the alert has something to fire on.</text>
</svg>
