AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Peach agenda parser (Lab 6). The browser posts pasted text to this
  function's URL with a Cognito ID token; the function asks Claude on Bedrock
  for a structured agenda and returns it. It only suggests: the user checks
  the pre-filled form and saves through the API, whose endpoints validate and
  write. The function needs no database, so it runs outside the VPC and
  reaches Bedrock over the internet - no NAT, no interface endpoint, nothing
  billed while nobody parses. Plus the account's $5 monthly budget alarm.

  Deployed by scripts/deploy-ai.sh, which reads the image and the Cognito ids
  from the live backend stack.

Parameters:
  ProjectName:
    Type: String
    Default: peach
    Description: Prefix for every resource name, and the project tag.

  ImageUri:
    Type: String
    Description: The backend image; the parser runs it with its own handler.

  Architecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]
    Description: Must match the image.

  CognitoUserPoolId:
    Type: String
    Description: The pool whose ID tokens the parser accepts - the API's pool.

  CognitoClientId:
    Type: String

  ParserModel:
    Type: String
    Default: anthropic.claude-opus-5-5
    Description: >-
      Bedrock model id. Configuration, not code: anthropic.claude-haiku-5-5
      costs about 40 times less per parse.

  AllowedOrigins:
    Type: CommaDelimitedList
    Description: >-
      Browser origins the function URL answers (CORS), e.g. the site's custom
      domain, its cloudfront.net name and http://localhost:3000.

  BudgetEmail:
    Type: String
    Default: ""
    Description: >-
      Who the budget alarm emails. Empty means no budget. No verification
      needed: AWS Budgets sends to any address.

  BudgetLimitUsd:
    Type: Number
    Default: 5

  LogRetentionDays:
    Type: Number
    Default: 14

Conditions:
  HasBudgetEmail: !Not [!Equals [!Ref BudgetEmail, ""]]

Resources:
  # --- the parser -----------------------------------------------------------

  ParserRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: call-bedrock
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # The Anthropic Messages API on Bedrock (bedrock-mantle). Any
              # model for now; narrowing it to ParserModel is a discussion
              # question in docs/lab6.md.
              - Sid: Inference
                Effect: Allow
                Action: bedrock-mantle:CreateInference
                Resource: "*"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ParserLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-agenda-parser"
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # No VpcConfig: Bedrock and the pool's public keys are on the internet, and
  # the database is not needed. The API's image, so the schemas and the token
  # checks are the same code the API runs.
  ParserFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-agenda-parser"
      Description: Pasted text in, a suggested agenda out. Writes nothing.
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command: ["app.ai.agenda_lambda.handler"]
      Architectures: [!Ref Architecture]
      MemorySize: 512
      Timeout: 30
      Role: !GetAtt ParserRole.Arn
      LoggingConfig:
        LogGroup: !Ref ParserLogGroup
      Environment:
        Variables:
          APP_ENV: production
          PARSER_MODEL: !Ref ParserModel
          BEDROCK_REGION: !Ref AWS::Region
          COGNITO_REGION: !Ref AWS::Region
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # Public, like the API's: the handler checks the Cognito token and answers
  # 401 to anything else, because every call costs money.
  ParserUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref ParserFunction
      AuthType: NONE
      Cors:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [POST]
        AllowHeaders: [authorization, content-type]
        MaxAge: 3600

  # A public function URL needs both grants: InvokeFunctionUrl, and
  # InvokeFunction limited to calls that came through the URL.
  ParserUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ParserFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  ParserUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ParserFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # --- the cheapest insurance in the course ------------------------------------

  # The whole account, not only this stack: a forgotten endpoint elsewhere
  # costs the same money.
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetEmail
    Properties:
      Budget:
        BudgetName: !Sub "${ProjectName}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref BudgetLimitUsd
          Unit: USD
      NotificationsWithSubscribers:
        # Money already spent...
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        # ...and a month on its way past the limit, while there is time to act.
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
      ResourceTags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

Outputs:
  ParserUrl:
    Description: The function URL, with no trailing slash. The site posts to it.
    Value: !Sub
      - "https://${Host}"
      - Host: !Select [2, !Split ["/", !GetAtt ParserUrl.FunctionUrl]]

  FunctionName:
    Value: !Ref ParserFunction

  LogGroupName:
    Value: !Ref ParserLogGroup

  BudgetName:
    Condition: HasBudgetEmail
    Value: !Sub "${ProjectName}-monthly"
