# Redpanda (speaks the Kafka protocol) and its Console, on this laptop only.
name: peach-lab8

services:
  redpanda:
    image: redpandadata/redpanda:v26.2.6
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      # Containers reach the broker as redpanda:9092, the laptop as localhost:19092.
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:19092
    ports:
      - "127.0.0.1:19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 3s
      timeout: 5s
      retries: 20

  create-topic:
    image: redpandadata/redpanda:v26.2.6
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - rpk topic create payments --partitions 3 --replicas 1 -X brokers=redpanda:9092 || true

  console:
    image: redpandadata/console:v3.13.1
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "127.0.0.1:8080:8080"
